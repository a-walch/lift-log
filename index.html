<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full-Body Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5fd0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column; home screen of big choices, then each view with a back arrow; day pages with a fixed bottom dock */
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b1f27; --muted:#626b7a; --line:#dde1e8;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-soft:#e6edfb;
  --good:#1f7a4a; --good-soft:#e3f3ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1b1e25; --ink:#e9ecf2; --muted:#9aa3b2; --line:#2c313b;
    --accent:#6f95f2; --accent-ink:#0d1220; --accent-soft:#1f2a44;
    --good:#6cc995; --good-soft:#18301f; --warn:#e6b25c; --warn-soft:#33270f; --bad:#f08a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1b1e25; --ink:#e9ecf2; --muted:#9aa3b2; --line:#2c313b;
  --accent:#6f95f2; --accent-ink:#0d1220; --accent-soft:#1f2a44;
  --good:#6cc995; --good-soft:#18301f; --warn:#e6b25c; --warn-soft:#33270f; --bad:#f08a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 210px}
header{padding:12px 0 0}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0 0 8px;text-transform:uppercase}
nav{display:flex;gap:6px;overflow-x:auto}
nav button{flex:1 0 auto;font:600 15px var(--body);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);margin:10px 0 0}
.status.warn{color:var(--warn)}
h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.list{display:grid;gap:10px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.code{font-family:var(--display);font-weight:700;font-size:15px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;flex:none;margin-top:2px}
.ex-title{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:17px;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-family:inherit}
.ex-sub{font-size:13px;color:var(--muted)}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.add-img{flex:none;font:500 12px var(--body);border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;width:52px;height:52px;cursor:pointer}
.rx{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.chip{padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sug{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.sug.up{background:var(--good-soft)}
.sug.hold{background:var(--warn-soft)}
.sug b{font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:44px 1fr 18px 1fr;gap:6px;align-items:center}
.set label{font-size:13px;color:var(--muted)}
.set input{width:100%;font:500 17px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.8}
.set .x{text-align:center;color:var(--muted)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{font:500 13px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details p{margin:6px 0 0;font-size:14px}
.mob{display:flex;gap:10px;align-items:center}
.mob .ex-title{display:grid;gap:2px}
.primary{width:100%;font:700 18px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:18px}
.primary[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}
.hist-item{display:grid;gap:6px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist-top strong{font-family:var(--display);font-size:18px;text-transform:uppercase}
.hist-lines{font-size:14px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.danger{color:var(--bad);border-color:var(--bad)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.field input{font:500 18px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:180px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal-box{background:var(--surface);border-radius:12px;padding:14px;max-width:520px;width:100%;display:grid;gap:10px;max-height:90%;overflow:auto}
.modal-box img{max-width:100%;border-radius:8px;display:block;margin:0 auto;max-height:60vh;object-fit:contain}
.modal-box h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase}
.empty-img{padding:28px 12px;text-align:center;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
[hidden]{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;padding-bottom:0}
.back{font:600 20px var(--body);width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1}
.top-title{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.home-title{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.02em;margin:20px 0 14px;line-height:1.05}
.home-grid{display:grid;gap:12px}
.home-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-btn{display:grid;gap:4px;text-align:left;padding:18px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--body)}
.home-btn .hb-main{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;line-height:1}
.home-btn.small .hb-main{font-size:22px}
.home-btn .hb-sub{font-size:14px;color:var(--muted)}
.home-btn:active{background:var(--accent-soft)}
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.hchip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.hchip.prog{background:var(--warn-soft);color:var(--warn)}
.hchip.next{background:var(--accent-soft);color:var(--accent)}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.page-head h2{margin:12px 0 2px}
.page-head .note{margin:0}
.counter{font-family:var(--display);font-weight:700;font-size:17px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 10px;flex:none;font-variant-numeric:tabular-nums;margin-top:12px}
.pager .counter{margin-top:0}
h3.sec{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.dock>*{max-width:528px;width:100%;margin:0 auto}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pager .ghost{font-size:15px;padding:10px 16px}
.pager .ghost[disabled]{opacity:.4}
.rest-row{display:flex;gap:6px;flex-wrap:wrap}
.rest-btn{flex:1 1 140px;font:600 14px var(--body);padding:10px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;font-variant-numeric:tabular-nums}
.t-run{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.t-big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.t-btns{display:flex;gap:6px}
.t-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.t-bar span{display:block;height:100%;background:var(--accent)}
.t-done{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--good-soft);border-radius:10px;padding:10px 12px}
.t-done .t-big{color:var(--good);font-size:30px}
.t-ok{width:auto;margin:0;padding:12px 22px}
body.rest-over .dock{animation:pulse 1.2s ease-in-out 4}
@keyframes pulse{0%,100%{background:var(--surface)}50%{background:var(--good-soft)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="top" hidden>
  <div class="wrap topbar">
    <button id="backHome" class="back" aria-label="Back to the home screen">←</button>
  </div>
</header>
<main class="wrap">
  <p id="status" class="status">Opening your data…</p>
  <div id="view"></div>
</main>
<div id="dock" class="dock" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Program ---------- */
const PULL_DAYS = {
  1:{sets:4,reps:4,pct:0.85,label:"85%"},
  2:{sets:3,reps:6,pct:0.75,label:"75%"},
  3:{sets:5,reps:2,pct:0.90,label:"90%"}
};
const WARMUP = [
  {id:"m-wrist-circles",name:"Wrist circles",dose:"10 each direction",how:"Fingers interlaced, slow full circles."},
  {id:"m-wrist-rocks",name:"Wrist rocks, palms down",dose:"10 per hand position",how:"On hands and knees, fingers forward, then sideways, then back. Rock forward and back over the hands."},
  {id:"m-wrist-rocks-back",name:"Wrist rocks, backs of hands down",dose:"10",how:"Backs of hands on the floor, fingers toward the knees, rock gently."},
  {id:"m-palm-raises",name:"Palm raises",dose:"2 × 10–15",how:"On hands and knees, keep the fingers on the floor and lift the heels of the hands."},
  {id:"m-fingertip",name:"Fingertip push-offs",dose:"2 × 10",how:"On hands and knees, press through the fingertips so the palms lift; control the way down."},
  {id:"m-nerve-sliders",name:"Nerve sliders (seated)",dose:"10–15 each leg",how:"Straighten the knee while looking up, bend it while looking down. Smooth, no strong stretch."},
  {id:"m-ramp",name:"Ramp-up sets",dose:"2–3 light sets",how:"A few light pull-up and leg press sets before the working weight."}
];
const FLEX = [
  {id:"m-pancake",name:"Pancake (straddle) stretch",dose:"3 × 30–60 s",how:"Seated wide straddle, tilt the pelvis forward and walk the hands out with a flat back."},
  {id:"m-forearm",name:"Forearm flexor stretch",dose:"2 × 30 s",how:"On hands and knees, fingers pointing back toward the knees, arms straight, lean back gently."},
  {id:"m-shoulder-ext",name:"Shoulder extension stretch",dose:"2 × 30 s",how:"Sit in front of a bench, hands on it behind you, slide the hips forward and down."},
  {id:"m-hip-flexor",name:"Kneeling hip flexor stretch",dose:"2 × 30–60 s each side",how:"Half-kneeling, squeeze the back glute and shift the hips forward; torso upright."}
];
const BLOCKS = [
  {id:"pullup",code:"A1",name:"Weighted pull-up",muscles:"Lats, upper back, biceps",pull:true,rest:"~2 min → A2",note:"Strength priority. Dead hang to chin over the bar, keep the plate still. On Day 3, do it alone without pairing."},
  {id:"incline-db-press",code:"A2",name:"Incline dumbbell press",muscles:"Upper chest, front delts, triceps",sets:3,lo:6,hi:10,inc:2,rest:"~2 min → A1",note:"Bench at 30–45°. Weight is per dumbbell. Lower to the sides of the upper chest."},
  {id:"single-leg-press",code:"B1",name:"Single-leg press",muscles:"Quads, glutes, adductors",sets:3,lo:8,hi:12,inc:5,rest:"~2 min → B2",note:"3 sets per leg at the same weight; log the reps of your weaker leg. Go deep (knee toward chest) but stop just before the lower back lifts off the pad. Start with the weaker leg and match its reps on the other."},
  {id:"cable-lateral",code:"B2",name:"Cable lateral raise",muscles:"Side delts",sets:3,lo:10,hi:15,inc:1,rest:"~1.5 min → B1",note:"Cable crosses in front of the body; raise to shoulder height leading with the elbow."},
  {id:"zercher-hinge",code:"C1",name:"Zercher hinge",muscles:"Hamstrings, glutes, lower back, core",sets:3,lo:8,hi:12,inc:2.5,rest:"~1.5 min → C2",note:"Bar in the crook of the elbows (pad or towel helps), knees nearly straight. Push the hips back to a strong hamstring stretch, back flat; stop where it starts to round. If the arms or upper back give out before the hamstrings, use a pad or lower the weight."},
  {id:"seated-db-ohp",code:"C2",name:"Seated dumbbell overhead press",muscles:"Front delts, triceps, upper traps, serratus",sets:3,lo:6,hi:10,inc:2,rest:"~1.5 min → C1",note:"Bench upright, back supported. Press to full lockout with the biceps by the ears, the handstand position, and let the shoulder blades rotate up. Lower to about chin level. Weight is per dumbbell."},
  {id:"chest-row",code:"D1",name:"Chest-supported row",muscles:"Mid/upper back, rear delts, lats",sets:3,lo:8,hi:12,inc:2.5,rest:"~1.5 min → D2",note:"Chest stays on the pad; pull the elbows back toward the hips."},
  {id:"leg-ext",code:"D2",name:"Leg extension",muscles:"Quads (incl. rectus femoris)",sets:3,lo:10,hi:15,inc:2.5,rest:"~1.5 min → D3",note:"Recline the backrest a little if the machine allows."},
  {id:"cable-fly",code:"D3",name:"Cable or machine chest fly",muscles:"Chest",sets:3,lo:10,hi:15,inc:2.5,rest:"~1.5 min → D1",note:"Slight elbow bend, open wide for a deep stretch, then bring the hands together."},
  {id:"lying-leg-curl",code:"E1",name:"Lying leg curl",muscles:"Hamstrings (incl. short head)",sets:3,lo:10,hi:15,inc:2.5,rest:"~1 min → E2",note:"Bend the hips slightly: use the angled pad, let the hips rise a little, or put a folded towel under them, keeping the lower back neutral. Let the knees go almost straight at the bottom of every rep, curl fully, and lower over 2–3 s."},
  {id:"overhead-triceps",code:"E2",name:"Overhead cable triceps extension",muscles:"Triceps (long head)",sets:3,lo:10,hi:15,inc:2.5,rest:"~1 min → E1",note:"Face away from the cable, elbows by the head, let the rope go deep behind the head."},
  {id:"curl",code:"F1",variants:{1:{id:"preacher-curl",name:"Preacher curl",muscles:"Biceps"},2:{id:"hammer-preacher-curl",name:"Hammer preacher curl",muscles:"Brachialis, brachioradialis, biceps"},3:{id:"preacher-curl",name:"Preacher curl",muscles:"Biceps"}},sets:3,lo:8,hi:12,inc:1.25,rest:"~1 min → F2",note:"Lower until the elbow is almost straight, under control. No bouncing at the bottom."},
  {id:"leg-press-calf",code:"F2",name:"Calf raise on the leg press",muscles:"Calves (gastrocnemius, soleus)",sets:3,lo:10,hi:15,inc:5,rest:"~1 min → F1",note:"Balls of the feet on the bottom edge of the platform, heels hanging off, knees straight but not locked hard. Lower until the heels are fully stretched, pause 1–2 s, then push all the way onto the toes. No bouncing. Keep the safety stops engaged and start light: the main risk is the feet slipping off the edge."},
  {id:"cable-crunch",code:"G1",name:"Cable crunch (kneeling)",muscles:"Abs",sets:3,lo:8,hi:15,inc:2.5,rest:"~1 min → G2",note:"Hips stay still; curl the ribs toward the pelvis by rounding the spine."},
  {id:"hanging-leg-raise",code:"G2",name:"Hanging leg raise (or captain's chair)",muscles:"Lower abs, hip flexors",sets:3,lo:8,hi:15,inc:0,bw:true,rest:"~1 min → G1",note:"Curl the pelvis up at the top. Leave weight empty for bodyweight."}
];
const NAMES = {}; [...WARMUP,...FLEX].forEach(m=>NAMES[m.id]=m.name);
BLOCKS.forEach(b=>{ if(b.variants){Object.values(b.variants).forEach(v=>NAMES[v.id]=v.name)} else NAMES[b.id]=b.name; });

function exFor(b, day){
  if(b.pull){ const p=PULL_DAYS[day]; return {...b, sets:p.sets, lo:p.reps, hi:p.reps}; }
  if(b.variants){ const v=b.variants[day]; return {...b, id:v.id, name:v.name, muscles:v.muscles}; }
  return b;
}

/* ---------- State ---------- */
let db=null, assets=null, uid=null, profileRef=null, workoutsCol=null;
let profile={bw:73, max:65, images:{}};
let profileLoaded=false, workouts=[], workoutsLoaded=false;
let view="d1", draft={}, saving=false;
let confirmDelete=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{ if(v===null||v===undefined) return NaN; const n=parseFloat(String(v).replace(",",".")); return n; };
const fmt=n=>{ if(!isFinite(n)) return ""; return (Math.round(n*100)/100).toString(); };

function pullTarget(day){
  const p=PULL_DAYS[day]; const total=profile.bw+profile.max;
  return Math.floor(total*p.pct - profile.bw);
}

/* ---------- Draft (one viewer's unsent workout, browser only) ---------- */
function draftKey(day){ return "liftlog-draft-d"+day; }
function loadDraft(day){ try{ const s=localStorage.getItem(draftKey(day)); return s?JSON.parse(s):{}; }catch(e){ return {}; } }
function storeDraft(day){ try{ localStorage.setItem(draftKey(day), JSON.stringify(draft)); }catch(e){} }
function clearDraft(day){ try{ localStorage.removeItem(draftKey(day)); }catch(e){} }

/* ---------- History helpers ---------- */
function lastFor(exId, day){
  for(const w of workouts){
    if(exId==="pullup" && w.day!==day) continue;
    const s=w.entries && w.entries[exId];
    if(s && s.length) return {w, sets:s};
  }
  return null;
}
function shortDate(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }catch(e){ return ""; } }
function setsText(sets, bw, pull){
  return sets.map(s=>{
    const w = (s.w===null||s.w===undefined||s.w===0) ? (bw?"BW":(pull?"+0":"0")) : (pull?"+"+fmt(s.w):fmt(s.w));
    return w+"×"+s.r;
  }).join(" · ");
}

/* Suggestion: {weight, text, kind: up|hold|base|none} */
function suggest(ex, day){
  const last=lastFor(ex.id==="pullup"?"pullup":ex.id, day);
  if(ex.pull){
    const t=pullTarget(day), p=PULL_DAYS[day];
    if(last){
      const lw=Math.max(...last.sets.map(s=>s.w||0));
      const done=last.sets.length>=p.sets && last.sets.every(s=>s.r>=p.reps);
      if(done && lw>=t) return {weight:lw+1,kind:"up",text:`All ${p.sets}×${p.reps} done at +${fmt(lw)} kg last time. Go <b>+${fmt(lw+1)} kg</b>. If the sets felt easy, raise your max in "Max & weight".`};
      if(!done && lw>=t) return {weight:lw,kind:"hold",text:`Stay at <b>+${fmt(lw)} kg</b> until every set reaches ${p.reps} reps.`};
    }
    return {weight:t,kind:"base",text:`<b>+${fmt(t)} kg</b>: ${p.label} of your max (${fmt(profile.bw)} kg bodyweight + ${fmt(profile.max)} kg added).`};
  }
  if(!last) return {weight:null,kind:"none",text:`No history yet. Pick a weight you can lift for ${ex.lo}–${ex.hi} reps with 1–2 reps in reserve.`};
  const lw=Math.max(...last.sets.map(s=>s.w||0));
  const atTop=last.sets.length>=ex.sets && last.sets.every(s=>s.r>=ex.hi);
  const below=last.sets.some(s=>s.r<ex.lo);
  const label = ex.bw && lw===0 ? "bodyweight" : fmt(lw)+" kg";
  if(atTop){
    if(ex.inc>0) return {weight:lw+ex.inc,kind:"up",text:`Top of the range (${ex.hi}) on every set. Go <b>${fmt(lw+ex.inc)} kg</b> (+${fmt(ex.inc)}).`};
    return {weight:lw||null,kind:"up",text:`Top of the range on every set at ${label}. Make it harder: slower reps or an ankle weight.`};
  }
  if(below) return {weight:lw||null,kind:"hold",text:`Stay at <b>${label}</b> until every set reaches at least ${ex.lo} reps.`};
  return {weight:lw||null,kind:"base",text:`Stay at <b>${label}</b> and beat last time by a rep on at least one set.`};
}

/* ---------- Rendering ---------- */
function imgHtml(id, name){
  const a=profile.images && profile.images[id];
  if(a) return `<img class="thumb" src="${esc(imgUrl(a))}" alt="${esc(name)}" data-img="${esc(id)}">`;
  if(!assets) return "";
  return `<button class="add-img" data-img="${esc(id)}" aria-label="Add a picture of ${esc(name)}">+ photo</button>`;
}

function mobilityHtml(list){
  return `<div class="list">${list.map(m=>`
    <div class="card mob">
      ${imgHtml(m.id,m.name)}
      <div class="ex-title">
        <button class="ex-name" data-img="${esc(m.id)}">${esc(m.name)}</button>
        <span class="ex-sub">${esc(m.dose)}</span>
        <span class="note">${esc(m.how)}</span>
      </div>
    </div>`).join("")}</div>`;
}

function dayPages(){
  const groups=[];
  for(const b of BLOCKS){ const L=b.code[0]; let g=groups.find(x=>x.letter===L); if(!g){ g={type:"pair",letter:L,blocks:[]}; groups.push(g); } g.blocks.push(b); }
  return [{type:"warm"}, ...groups, {type:"flex"}];
}
let pageIdx=0;
function pageKey(day){ return "liftlog-page-d"+day; }
function loadPage(day){ try{ const n=parseInt(localStorage.getItem(pageKey(day)),10); return isFinite(n)?n:0; }catch(e){ return 0; } }
function storePage(day){ try{ localStorage.setItem(pageKey(day), String(pageIdx)); }catch(e){} }

function exerciseCard(b, day){
  const ex=exFor(b,day);
  const sug=suggest(ex,day);
  const last=lastFor(ex.id,day);
  const rows=draft[ex.id] || Array.from({length:ex.sets},()=>({w:"",r:""}));
  if(!draft[ex.id]) draft[ex.id]=rows;
  const repsPh = ex.lo===ex.hi ? String(ex.lo) : `${ex.lo}–${ex.hi}`;
  const wPh = sug.weight!==null && sug.weight!==undefined ? (ex.pull?"+":"")+fmt(sug.weight) : (ex.bw?"BW":"kg");
  const scheme = ex.pull ? `${ex.sets} × ${ex.lo} @ ${PULL_DAYS[day].label}` : `${ex.sets} × ${ex.lo}–${ex.hi}`;
  return `
    <article class="card" data-ex="${esc(ex.id)}">
      <div class="ex-head">
        <span class="code">${esc(ex.code)}</span>
        <div class="ex-title">
          <button class="ex-name" data-img="${esc(ex.id)}">${esc(ex.name)}</button>
          <div class="ex-sub">${esc(ex.muscles)}</div>
        </div>
        ${imgHtml(ex.id,ex.name)}
      </div>
      <div class="rx"><span class="chip">${esc(scheme)}</span><span class="chip">Rest ${esc(ex.rest)}</span></div>
      <div class="sug ${sug.kind==="up"?"up":sug.kind==="hold"?"hold":""}">${sug.text}</div>
      ${last?`<div class="last">Last (${esc(shortDate(last.w.date))}): ${esc(setsText(last.sets, ex.bw, ex.pull))}</div>`:""}
      <div class="sets">
        ${rows.map((r,i)=>`
        <div class="set">
          <label for="w-${esc(ex.id)}-${i}">Set ${i+1}</label>
          <input id="w-${esc(ex.id)}-${i}" inputmode="decimal" placeholder="${esc(wPh)}" value="${esc(r.w)}" data-k="w" data-i="${i}" aria-label="Set ${i+1} weight in kg${ex.pull?" added":""}">
          <span class="x">×</span>
          <input id="r-${esc(ex.id)}-${i}" inputmode="numeric" placeholder="${esc(repsPh)}" value="${esc(r.r)}" data-k="r" data-i="${i}" aria-label="Set ${i+1} reps">
        </div>`).join("")}
      </div>
      <div class="row-btns">
        <button class="ghost" data-addset="${esc(ex.id)}">+ Set</button>
        ${rows.length>1?`<button class="ghost" data-rmset="${esc(ex.id)}">− Set</button>`:""}
      </div>
      <details><summary>How to do it</summary><p>${esc(ex.note)}</p></details>
    </article>`;
}

function restSeconds(rest){ const m=String(rest).match(/([\d.]+)\s*min/); return m?Math.round(parseFloat(m[1])*60):90; }
function restNext(rest){ const m=String(rest).match(/→\s*(\S+)/); return m?m[1]:""; }

function dayHtml(day){
  const pages=dayPages();
  if(pageIdx<0||pageIdx>=pages.length) pageIdx=0;
  const p=pages[pageIdx], total=pages.length, isLast=p.type==="pair" && pages[pageIdx+1] && pages[pageIdx+1].type==="flex";
  const parts=[];
  if(p.type==="warm"){
    parts.push(`<div class="page-head"><div><h2>Warm-up · 5 min</h2><p class="note">Before lifting, every session.</p></div></div>`);
    parts.push(mobilityHtml(WARMUP));
  } else if(p.type==="flex"){
    parts.push(`<div class="page-head"><div><h2>Flexibility</h2><p class="note">After training, 3–5× a week. Strong but tolerable stretch, never sharp pain.</p></div></div>`);
    parts.push(mobilityHtml(FLEX));
  } else {
    const exs=p.blocks.map(b=>exFor(b,day));
    const kind=exs.length>2?"Trio":"Pair";
    parts.push(`<div class="page-head"><div><h2>Block ${esc(p.letter)} · ${kind}</h2><p class="note">${exs.map(e=>esc(e.code)+" "+esc(e.name)).join(" ↔ ")}</p></div></div>`);
    if(p.letter==="A" && day===3) parts.push(`<p class="note">Day 3: do the pull-ups alone first, then the press. No pairing on the 90% sets.</p>`);
    parts.push(`<div class="list">`+p.blocks.map(b=>exerciseCard(b,day)).join("")+`</div>`);
    if(isLast){
      parts.push(`<p class="note" style="margin-top:12px">Empty weight boxes use the grey suggested weight when you save. Only sets with reps filled in are saved. On weeks with 3 sessions, you can drop blocks C–G to 2 sets (keep calves at 3).</p>`);
      parts.push(`<button class="primary" id="finish" ${(!db||saving)?"disabled":""}>${saving?"Saving…":"Finish & save workout"}</button><p class="note">Then go to the next page for the flexibility routine.</p>`);
    }
  }
  return parts.join("");
}

function dockHtml(day){
  const pages=dayPages(); const p=pages[pageIdx]; const total=pages.length;
  let restBtns="";
  if(p && p.type==="pair"){
    restBtns=p.blocks.map(b=>{ const ex=exFor(b,day); const s=restSeconds(ex.rest); const nx=restNext(ex.rest);
      return `<button class="rest-btn" data-rest="${s}" data-next="${esc(nx)}" data-from="${esc(ex.code)}">After ${esc(ex.code)} · rest ${fmtClock(s)}</button>`; }).join("");
  }
  return `<div id="timer" class="timer">${restBtns?`<div class="rest-row">${restBtns}</div>`:""}</div>
    <div class="pager">
      <button class="ghost" data-page="-1" ${pageIdx===0?"disabled":""}>← Back</button>
      <span class="counter">${pageIdx+1}/${total}</span>
      <button class="ghost" data-page="1" ${pageIdx===total-1?"disabled":""}>Next →</button>
    </div>`;
}

/* ---------- Rest timer ---------- */
let timer=null; // {endAt, total, next, from, done}
let wakeLock=null;
function fmtClock(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function saveTimer(){ try{ timer?localStorage.setItem("liftlog-timer",JSON.stringify(timer)):localStorage.removeItem("liftlog-timer"); }catch(e){} }
function loadTimer(){ try{ const t=JSON.parse(localStorage.getItem("liftlog-timer")||"null"); if(t&&t.endAt) timer=t; }catch(e){} }
async function holdScreen(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
function startTimer(sec,next,from){ timer={endAt:Date.now()+sec*1000,total:sec,next,from,done:false}; saveTimer(); holdScreen(true); renderTimer(); }
function stopTimer(){ timer=null; saveTimer(); holdScreen(false); document.body.classList.remove("rest-over"); renderTimer(); }
function fireDone(){
  timer.done=true; saveTimer();
  try{ if(navigator.vibrate) navigator.vibrate([400,150,400,150,400]); }catch(e){}
  document.body.classList.add("rest-over");
  renderTimer();
}
function renderTimer(){
  const el=$("#timer"); if(!el) return;
  if(!timer){ const day=+view.slice(1); const d=$("#dock"); if(d && view.startsWith("d")) d.innerHTML=dockHtml(day); return; }
  if(timer.done){
    el.innerHTML=`<div class="t-done" role="alert"><div><div class="t-big">Rest over</div><div class="note">${timer.next?"Go: "+esc(timer.next):"Next set"}</div></div><button class="primary t-ok" data-tstop>OK</button></div>`;
    return;
  }
  const left=(timer.endAt-Date.now())/1000;
  const pct=Math.max(0,Math.min(100,100*left/timer.total));
  el.innerHTML=`<div class="t-run">
    <div class="t-main"><div class="t-big" id="tclock">${fmtClock(left)}</div><div class="note">Resting after ${esc(timer.from)}${timer.next?" · next "+esc(timer.next):""}</div></div>
    <div class="t-btns"><button class="ghost" data-tadj="-15">−15 s</button><button class="ghost" data-tadj="15">+15 s</button><button class="ghost" data-tstop>Stop</button></div>
    </div><div class="t-bar"><span id="tbar" style="width:${pct}%"></span></div>`;
}
function tick(){
  if(!timer||timer.done) return;
  const left=(timer.endAt-Date.now())/1000;
  if(left<=0){ fireDone(); return; }
  const c=$("#tclock"); if(c) c.textContent=fmtClock(left);
  const b=$("#tbar"); if(b) b.style.width=Math.max(0,100*left/timer.total)+"%";
}
setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ tick(); if(timer&&!timer.done) holdScreen(true); } });

function dayInProgress(day){
  let p=0; try{ p=parseInt(localStorage.getItem(pageKey(day)),10)||0; }catch(e){}
  const d=loadDraft(day);
  const any=Object.values(d).some(rows=>Array.isArray(rows)&&rows.some(r=>String(r.r||"").trim()!==""));
  return (p>0||any)?p:-1;
}
function homeHtml(){
  const total=dayPages().length;
  const next = workouts.length ? (workouts[0].day%3)+1 : 1;
  const subs={1:`Pull-ups 4×4 @ 85% (+${pullTarget(1)} kg) · preacher curl`,2:`Pull-ups 3×6 @ 75% (+${pullTarget(2)} kg) · hammer curl`,3:`Pull-ups 5×2 @ 90% (+${pullTarget(3)} kg), done alone · preacher curl`};
  const days=[1,2,3].map(d=>{
    const ip=dayInProgress(d);
    const chips=[ip>=0?`<span class="hchip prog">In progress · page ${ip+1}/${total}</span>`:"", (workoutsLoaded&&d===next)?`<span class="hchip next">Next up</span>`:""].join("");
    return `<button class="home-btn" data-go="d${d}"><span class="hb-main">Day ${d}</span><span class="hb-sub">${esc(subs[d])}</span>${chips?`<span class="hchips">${chips}</span>`:""}</button>`;
  }).join("");
  const lastTxt = workouts.length ? `${workouts.length} saved · last ${esc(shortDate(workouts[0].date))}` : "No workouts saved yet";
  const install = installEvt ? `<button class="primary" id="installBtn" style="margin:0 0 12px">Install app on this phone</button>` : "";
  return `<h1 class="home-title">Full-body lift log</h1>${install}
  <div class="home-grid">${days}
    <div class="home-row">
      <button class="home-btn small" data-go="history"><span class="hb-main">History</span><span class="hb-sub">${lastTxt}</span></button>
      <button class="home-btn small" data-go="settings"><span class="hb-main">Max &amp; weight</span><span class="hb-sub">${fmt(profile.bw)} kg · max +${fmt(profile.max)} kg</span></button>
    </div>
  </div>`;
}
function openLeaveConfirm(){
  const day=+view.slice(1), total=dayPages().length;
  const m=$("#modal");
  m.innerHTML=`<div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="cTitle">
    <h3 id="cTitle">Leave Day ${day}?</h3>
    <p class="note" style="font-size:15px">You're on page ${pageIdx+1}/${total}. What you've entered is kept on this phone, and Day ${day} will reopen on this page. Nothing is saved to your history until you tap Finish.</p>
    <div class="row-btns"><button class="ghost" id="cLeave">Leave to home</button><button class="primary t-ok" id="cStay" style="margin-left:auto">Stay</button></div>
  </div>`;
  m.hidden=false; $("#cStay").focus();
}
function historyHtml(){
  if(!workoutsLoaded) return `<p class="note">Loading your history…</p>`;
  if(!workouts.length) return `<h2>History</h2><p class="note">No workouts saved yet. Finish a day and it shows up here.</p>`;
  return `<h2>History · ${workouts.length} workout${workouts.length>1?"s":""}</h2><div class="list">${workouts.map(w=>{
    const lines=Object.entries(w.entries||{}).map(([id,sets])=>{
      const b=BLOCKS.find(x=>x.id===id); const bw=b&&b.bw;
      return `<div><strong>${esc(NAMES[id]||id)}</strong>: ${esc(setsText(sets,bw,id==="pullup"))}</div>`;
    }).join("");
    const confirming = confirmDelete===w._id;
    return `<div class="card hist-item">
      <div class="hist-top"><strong>Day ${esc(w.day)} · ${esc(new Date(w.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}))}</strong>
      <button class="ghost ${confirming?"danger":""}" data-del="${esc(w._id)}">${confirming?"Tap again to delete":"Delete"}</button></div>
      <div class="hist-lines">${lines}</div></div>`;
  }).join("")}</div>`;
}

function settingsHtml(){
  const total=profile.bw+profile.max;
  const rows=[1,2,3].map(d=>{const p=PULL_DAYS[d]; return `<tr><td>Day ${d}</td><td>${p.sets}×${p.reps}</td><td>${p.label}</td><td>${fmt(total*p.pct)} kg</td><td><strong>+${fmt(pullTarget(d))} kg</strong></td></tr>`}).join("");
  return `<h2>Max &amp; bodyweight</h2>
  <div class="card">
    <div class="field"><label for="bw">Bodyweight (kg)</label><input id="bw" inputmode="decimal" value="${esc(fmt(profile.bw))}"></div>
    <div class="field"><label for="max">Weighted pull-up max, added weight (kg)</label><input id="max" inputmode="decimal" value="${esc(fmt(profile.max))}"></div>
    <button class="primary" id="saveSettings" style="margin-top:6px" ${db?"":"disabled"}>Save</button>
    <p class="note">Total max: ${fmt(total)} kg. Pull-up loads are calculated on the total (bodyweight + added), then rounded down to the kilo.</p>
  </div>
  <h2>Pull-up loads</h2>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Day</th><th>Sets</th><th>%</th><th>Total</th><th>Added</th></tr></thead><tbody>${rows}</tbody></table></div>`+backupHtml();
}

function render(){
  const v=$("#view"), d=$("#dock");
  const titles={d1:"Day 1",d2:"Day 2",d3:"Day 3",history:"History",settings:"Max & weight"};
  $("#top").hidden = view==="home";
  const st=$("#status"); st.hidden = view!=="home" && !st.classList.contains("warn");
  if(view==="home"){ d.hidden=true; d.innerHTML=""; v.innerHTML=homeHtml(); }
  else if(view.startsWith("d")){ const day=+view.slice(1); v.innerHTML=dayHtml(day); d.innerHTML=dockHtml(day); d.hidden=false; renderTimer(); }
  else { d.hidden=true; d.innerHTML=""; v.innerHTML = view==="history"?historyHtml():settingsHtml(); }
}
function goPage(delta){
  const day=+view.slice(1), n=dayPages().length;
  const next=Math.max(0,Math.min(n-1,pageIdx+delta));
  if(next===pageIdx) return;
  pageIdx=next; storePage(day); render(); window.scrollTo(0,0);
}

function setView(next){
  view=next;
  if(view.startsWith("d")){ draft=loadDraft(+view.slice(1)); pageIdx=loadPage(+view.slice(1)); }
  confirmDelete=null;
  try{ if(location.hash!=="#"+view) history.replaceState(null,"","#"+view); }catch(e){}
  render(); window.scrollTo(0,0);
}

/* ---------- Toast & modal ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
let modalFor=null;
function openModal(id){
  modalFor=id;
  const a=profile.images && profile.images[id];
  const name=NAMES[id]||id;
  const m=$("#modal");
  m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(name)}">
    <h3>${esc(name)}</h3>
    ${a?`<img src="${esc(imgUrl(a))}" alt="${esc(name)}">`:`<div class="empty-img">No picture yet.${assets?" Add a screenshot or photo so you remember what it looks like.":" Pictures cannot be stored in this browser."}</div>`}
    <div class="row-btns">
      ${assets?`<button class="ghost" id="mPick">${a?"Replace picture":"Add picture"}</button>`:""}
      ${assets&&a?`<button class="ghost danger" id="mRemove">Remove</button>`:""}
      <button class="ghost" id="mClose" style="margin-left:auto">Close</button>
    </div></div>`;
  m.hidden=false;
  $("#mClose").focus();
}
function closeModal(){ $("#modal").hidden=true; $("#modal").innerHTML=""; modalFor=null; }

/* ---------- Writes ---------- */
let profileQueue=Promise.resolve();
function saveProfile(){
  if(!profileRef) return Promise.reject(new Error("offline"));
  const body={bw:profile.bw,max:profile.max,images:{...profile.images}};
  profileQueue=profileQueue.catch(()=>{}).then(()=>profileRef.set(body));
  return profileQueue;
}

async function finishWorkout(){
  const day=+view.slice(1);
  const entries={};
  for(const b of BLOCKS){
    const ex=exFor(b,day);
    const sug=suggest(ex,day);
    const rows=draft[ex.id]||[];
    const sets=[];
    for(const r of rows){
      const reps=parseInt(r.r,10);
      if(!(reps>0)) continue;
      let w=num(r.w);
      if(!isFinite(w)) w = (sug.weight!==null&&sug.weight!==undefined) ? sug.weight : 0;
      sets.push({w:Math.round(w*100)/100, r:reps});
    }
    if(sets.length) entries[ex.id]=sets;
  }
  if(!Object.keys(entries).length){ toast("Fill in the reps of at least one set first."); return; }
  saving=true; render();
  try{
    await workoutsCol.add({date:new Date().toISOString(), day, entries});
    draft={}; clearDraft(day);
    toast("Workout saved.");
  }catch(e){
    toast(e&&e.code==="quota_exceeded"?"Storage is full: delete old workouts in History.":"Couldn't save. Check your connection and tap Finish again.");
  }finally{ saving=false; render(); }
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(!t.closest("#dock")) return;
  const pg=t.closest("[data-page]"); if(pg){ goPage(+pg.dataset.page); return; }
  const rb=t.closest("[data-rest]"); if(rb){ startTimer(+rb.dataset.rest, rb.dataset.next, rb.dataset.from); return; }
  const adj=t.closest("[data-tadj]"); if(adj&&timer&&!timer.done){ timer.endAt+=(+adj.dataset.tadj)*1000; timer.total=Math.max(timer.total,(timer.endAt-Date.now())/1000); saveTimer(); tick(); return; }
  if(t.closest("[data-tstop]")){ stopTimer(); return; }
});
$("#backHome").addEventListener("click",()=>{
  if(view.startsWith("d") && pageIdx>0) openLeaveConfirm(); else setView("home");
});

$("#view").addEventListener("input",e=>{
  const inp=e.target; if(!inp.dataset.k) return;
  const card=inp.closest("[data-ex]"); if(!card) return;
  const id=card.dataset.ex, i=+inp.dataset.i;
  if(!draft[id]) return;
  draft[id][i][inp.dataset.k]=inp.value;
  storeDraft(+view.slice(1));
});

$("#view").addEventListener("click",async e=>{
  const t=e.target;
  const go=t.closest("[data-go]"); if(go){ setView(go.dataset.go); return; }
  const img=t.closest("[data-img]"); if(img){ openModal(img.dataset.img); return; }
  const add=t.closest("[data-addset]");
  if(add){ draft[add.dataset.addset].push({w:"",r:""}); storeDraft(+view.slice(1)); render(); return; }
  const rm=t.closest("[data-rmset]");
  if(rm){ draft[rm.dataset.rmset].pop(); storeDraft(+view.slice(1)); render(); return; }
  if(t.id==="finish"){ finishWorkout(); return; }
  if(t.id==="exportBtn"){ exportBackup(); return; }
  if(t.id==="importBtn"){ $("#importFile").click(); return; }
  if(t.id==="installBtn" && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); return; }
  const del=t.closest("[data-del]");
  if(del){
    const id=del.dataset.del;
    if(confirmDelete!==id){ confirmDelete=id; render(); return; }
    confirmDelete=null;
    try{ await workoutsCol.doc(id).delete(); toast("Workout deleted."); }catch(err){ toast("Couldn't delete. Try again."); }
    return;
  }
  if(t.id==="saveSettings"){
    const bw=num($("#bw").value), mx=num($("#max").value);
    if(!(bw>20&&bw<300) || !(mx>=0&&mx<300)){ toast("Enter your bodyweight and added max in kg."); return; }
    profile.bw=bw; profile.max=mx;
    try{ await saveProfile(); toast("Saved. Pull-up loads updated."); }catch(err){ toast("Couldn't save. Try again."); }
    render();
  }
});

$("#modal").addEventListener("click",async e=>{
  if(e.target.id==="modal"||e.target.id==="mClose"||e.target.id==="cStay"){ closeModal(); return; }
  if(e.target.id==="iDo"){ closeModal(); applyImport(); return; }
  if(e.target.id==="cLeave"){ closeModal(); setView("home"); return; }
  if(e.target.id==="mPick"){ $("#file").click(); return; }
  if(e.target.id==="mRemove"){
    const id=modalFor; const old=profile.images[id];
    delete profile.images[id];
    try{ await saveProfile(); if(old&&assets){ try{ await assets.delete(old); }catch(_){} } toast("Picture removed."); }
    catch(err){ profile.images[id]=old; toast("Couldn't remove. Try again."); }
    closeModal(); render();
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#modal").hidden) closeModal(); });

$("#importFile").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) readImport(f); });
$("#file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f||!modalFor||!assets) return;
  const id=modalFor;
  toast("Uploading picture…");
  try{
    const res=await assets.upload(f);
    const old=profile.images[id];
    profile.images[id]=res.id;
    await saveProfile();
    if(old){ try{ await assets.delete(old); }catch(_){} }
    toast("Picture saved.");
    openModal(id); render();
  }catch(err){ toast("Couldn't upload that picture. Try a smaller image."); }
});

/* ---------- Start ---------- */
(function initView(){
  const h=(location.hash||"").slice(1);
  view=["home","d1","d2","d3","history","settings"].includes(h)?h:"home";
  draft=loadDraft(+view.slice(1)||1);
  pageIdx=view.startsWith("d")?loadPage(+view.slice(1)):0;
  loadTimer();
  render();
})();

/* ---------- Local storage on this phone (IndexedDB) ---------- */
const IDB={d:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("liftlog",1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore("kv"); d.createObjectStore("workouts",{keyPath:"_id"}); d.createObjectStore("images"); };
    r.onsuccess=()=>{ IDB.d=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=IDB.d.transaction(store,mode); const st=t.objectStore(store); let out; const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=t.onabort=()=>rej(t.error); }); }
};
var imageUrls={};
function imgUrl(id){ return imageUrls[id]||""; }
async function reloadWorkouts(){
  const all=await IDB.tx("workouts","readonly",s=>s.getAll());
  workouts=(all||[]).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  workoutsLoaded=true; updateStatus();
  const typing=document.activeElement && document.activeElement.tagName==="INPUT";
  if(!typing) render();
}
function updateStatus(){
  const st=$("#status"); st.className="status";
  st.textContent = workouts.length ? `Saved on this phone · ${workouts.length} workout${workouts.length>1?"s":""} · last on ${shortDate(workouts[0].date)}` : "Saved on this phone · no workouts yet";
}
function shrinkImage(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const max=1200; let w=im.naturalWidth,h=im.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b||file); },"image/jpeg",0.85); };
    im.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    im.src=url;
  });
}
const localProfileRef={ set: body=>IDB.tx("kv","readwrite",s=>s.put(body,"profile")) };
const localWorkouts={
  add: async data=>{ const _id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); await IDB.tx("workouts","readwrite",s=>s.put({...data,_id})); await reloadWorkouts(); },
  doc: id=>({ delete: async()=>{ await IDB.tx("workouts","readwrite",s=>s.delete(id)); await reloadWorkouts(); } })
};
const localAssets={
  upload: async file=>{ const blob=await shrinkImage(file); const id="img-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); await IDB.tx("images","readwrite",s=>s.put(blob,id)); imageUrls[id]=URL.createObjectURL(blob); return {id}; },
  delete: async id=>{ await IDB.tx("images","readwrite",s=>s.delete(id)); if(imageUrls[id]){ URL.revokeObjectURL(imageUrls[id]); delete imageUrls[id]; } }
};

/* ---------- Backup ---------- */
function blobToDataUrl(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }
async function dataUrlToBlob(u){ return (await fetch(u)).blob(); }
async function exportBackup(){
  try{
    const keys=await IDB.tx("images","readonly",s=>s.getAllKeys());
    const blobs=await IDB.tx("images","readonly",s=>s.getAll());
    const images={}; for(let i=0;i<keys.length;i++) images[keys[i]]=await blobToDataUrl(blobs[i]);
    const data={app:"liftlog",version:1,exported:new Date().toISOString(),profile:{bw:profile.bw,max:profile.max,images:{...profile.images}},workouts,images};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="lift-log-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    await IDB.tx("kv","readwrite",s=>s.put(new Date().toISOString(),"lastBackup")); lastBackup=new Date().toISOString();
    toast("Backup file saved to your downloads."); render();
  }catch(e){ toast("Couldn't create the backup file."); }
}
var pendingImport=null, lastBackup=null;
async function readImport(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.app!=="liftlog"||!Array.isArray(data.workouts)) throw new Error("bad");
    pendingImport=data;
    const m=$("#modal");
    m.innerHTML=`<div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="iTitle">
      <h3 id="iTitle">Restore this backup?</h3>
      <p class="note" style="font-size:15px">Backup from ${esc(new Date(data.exported).toLocaleDateString())} with ${data.workouts.length} workout${data.workouts.length===1?"":"s"}. It replaces everything currently on this phone: workouts, max, bodyweight and pictures.</p>
      <div class="row-btns"><button class="ghost" id="mClose">Cancel</button><button class="primary t-ok" id="iDo" style="margin-left:auto">Replace</button></div></div>`;
    m.hidden=false;
  }catch(e){ toast("That file isn't a lift log backup."); }
}
async function applyImport(){
  const data=pendingImport; pendingImport=null; if(!data) return;
  try{
    await IDB.tx("workouts","readwrite",s=>s.clear());
    await IDB.tx("images","readwrite",s=>s.clear());
    Object.values(imageUrls).forEach(u=>URL.revokeObjectURL(u)); for(const k in imageUrls) delete imageUrls[k];
    for(const w of data.workouts){ const rec={...w}; if(!rec._id) rec._id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); await IDB.tx("workouts","readwrite",s=>s.put(rec)); }
    for(const [id,u] of Object.entries(data.images||{})){ const b=await dataUrlToBlob(u); await IDB.tx("images","readwrite",s=>s.put(b,id)); imageUrls[id]=URL.createObjectURL(b); }
    const p=data.profile||{}; profile={bw:+p.bw||73,max:(p.max===0?0:(+p.max||65)),images:{...(p.images||{})}};
    await localProfileRef.set({bw:profile.bw,max:profile.max,images:profile.images});
    await reloadWorkouts(); toast("Backup restored.");
  }catch(e){ toast("Restore failed. Your data may be incomplete: try the import again."); }
}
function backupHtml(){
  const days = lastBackup ? Math.floor((Date.now()-new Date(lastBackup))/86400000) : null;
  const when = lastBackup ? (days===0?"today":days===1?"yesterday":days+" days ago") : "never";
  return `<h2>Backup</h2>
  <div class="card">
    <p class="note" style="font-size:15px;margin:0">Everything is stored only on this phone. Export a backup file now and then (for example to Google Drive) so a new phone or a cleared browser doesn't lose your history.</p>
    <p class="note" style="margin:0">Last backup: <strong>${when}</strong></p>
    <div class="row-btns"><button class="ghost" id="exportBtn">Export backup</button><button class="ghost" id="importBtn">Restore from file</button></div>
  </div>`;
}

/* ---------- Install prompt ---------- */
var installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(view==="home") render(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; if(view==="home") render(); });

(async function startLocal(){
  try{
    await IDB.open();
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    const p=await IDB.tx("kv","readonly",s=>s.get("profile"));
    if(p) profile={bw:+p.bw||73,max:(p.max===0?0:(+p.max||65)),images:{...(p.images||{})}};
    lastBackup=await IDB.tx("kv","readonly",s=>s.get("lastBackup"))||null;
    const keys=await IDB.tx("images","readonly",s=>s.getAllKeys());
    const blobs=await IDB.tx("images","readonly",s=>s.getAll());
    keys.forEach((k,i)=>{ imageUrls[k]=URL.createObjectURL(blobs[i]); });
    db=true; assets=localAssets; profileRef=localProfileRef; workoutsCol=localWorkouts; profileLoaded=true;
    await reloadWorkouts();
  }catch(e){
    const st=$("#status"); st.textContent="This browser won't let the app store data. Open it in Chrome (not a private tab)."; st.className="status warn"; render();
  }
})();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

</script>
